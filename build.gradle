plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.142'
    id 'idea'
}

version = mod_version
group = mod_group_id

base { archivesName = 'blue_skies' }

// 1.21.1 ships Java 21.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    // Official NeoForge CDN mirror first: serves net.neoforged* artifacts
    // (neoforge/neoform/parchment/moddev) quickly from CN networks.
    maven { url 'https://neoforged.forgecdn.net/releases' }
    mavenCentral()
    maven { url 'https://maven.creeperhost.net/' }
    maven { url 'https://api.modrinth.com/maven' }
}

// ---------------------------------------------------------------------------
// Sources:
//  * src/main/java               -> Blue Skies (decompiled, ARR) + Structure Gel
//                                  API decompiled 1.20.4 baseline (GPL-3.0)
//  * embedded/structure_gel_api -> OFFICIAL upstream SG API sources (26.1.x),
//                                  embedded per request. Opt-in to compiling
//                                  them with -PuseOfficialSg=true; they target
//                                  MC 26.1 and need a downgrade pass first.
// ---------------------------------------------------------------------------
sourceSets {
    main {
        java {
            srcDir 'src/main/java'
            if (project.hasProperty('useOfficialSg') && project.property('useOfficialSg') == 'true') {
                srcDir 'embedded/structure_gel_api/src/main/java'
            }
        }
        resources {
            srcDir 'src/main/resources'
        }
    }
}

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        server {
            server()
            programArgument '--nogui'
        }
        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all',
                    '--output', file('src/generated/resources/').getAbsolutePath(),
                    '--existing', file('src/main/resources/').getAbsolutePath()
        }
        configureEach {
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    // Both mods are shipped inside ONE jar (the SG API is embedded).
    mods {
        "${mod_id}" { sourceSet(sourceSets.main) }
        'structure_gel' { sourceSet(sourceSets.main) }
    }
}

// No third-party mod dependencies are required for the base port.

var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
            minecraft_version       : minecraft_version,
            minecraft_version_range : minecraft_version_range,
            neo_version_range       : neo_version_range,
            loader_version_range    : loader_version_range,
            mod_id                  : mod_id,
            mod_name                : mod_name,
            mod_license             : mod_license,
            mod_version             : mod_version,
            sg_version              : sg_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    // Porting diagnostics are collected separately by tools/analyze_compile.py.
    options.compilerArgs += ['-Xmaxerrs', '50000']
}

// Ship everything in one jar: Blue Skies classes + embedded SG classes + resources.
jar {
    from('src/main/resources') { exclude 'META-INF/neoforge.mods.toml' }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}
