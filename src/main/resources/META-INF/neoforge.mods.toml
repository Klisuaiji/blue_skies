modLoader="javafml"
loaderVersion="${loader_version_range}"
license="All Rights Reserved"
issueTrackerURL="https://github.com/Klisuaiji/blue_skies/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''Blue Skies adds two dimensions, the Everbright and the Everdawn, with new blocks, weapons, mobs and dungeons.'''
logoFile="banner.png"

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="${neo_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="structure_gel"
type="required"
versionRange="[3.0,)"
ordering="NONE"
side="BOTH"

[[mixins]]
config="blue_skies.mixins.json"

[modproperties.${mod_id}]
catalogueImageIcon="logo.png"
