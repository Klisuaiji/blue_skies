org.gradle.jvmargs=-Xmx4G
org.gradle.daemon=false
org.gradle.parallel=true
org.gradle.caching=true

# --- Environment -----------------------------------------------------------
minecraft_version=1.21.1
minecraft_version_range=[1.21.1]
neo_version=21.1.265
neo_version_range=[21.1.265,)
loader_version_range=[1,)

# Parchment gives readable parameter names while porting.
parchment_minecraft_version=1.21
parchment_mappings_version=2024.11.10

# --- Mod properties --------------------------------------------------------
mod_id=blue_skies
mod_name=NeoBlue Skies
mod_license=All Rights Reserved (original Blue Skies); GPL-3.0 (embedded Structure Gel API)
mod_version=1.3.32-port0.1.0
mod_group_id=com.legacy.blue_skies
sg_version=2.19.1-port0.1.0

# Optional: compile the embedded OFFICIAL 26.1.x Structure Gel API sources
# instead of the 1.20.4 decompiled baseline. Requires an additional downgrade
# pass (Identifier -> ResourceLocation, PortalShape, GameRules, ...).
# Run with: gradlew build -PuseOfficialSg=true
useOfficialSg=false
